{% load staticfiles %}
<script type="text/javascript">
	/*
	  Trading-floor Phaser engine + page controller.

	  Movement source: trading_reverie.py never rewrites environment/{step}.json,
	  so there's no raw per-step (x,y) from the backend -- translator/sim_data.py
	  derives one from the actual decision (BUY/SELL walks the agent to the
	  market board, HOLD keeps them at their desk, a real peer interaction sends
	  both parties out to the meeting aisle). That's what's walked here, tile by
	  tile, around the office furniture via BFS over the map's own Collisions
	  layer.

	  LIVE MODE: starts with an empty all_movement and fetches from
	  trading_poll() every POLL_INTERVAL_MS while meta.json's sim_running flag
	  is set. Once the backend finishes, one last poll flips the badge and
	  polling stops -- what's on screen keeps working as a normal replay.

	  RENDERING: the office is 44x32 @16px = 704x512. That is small on a modern
	  display, so the canvas is the full map at 2x (1408x1024) with the camera
	  zoomed to match, then CSS-scaled down to the column width with
	  image-rendering:pixelated. Crisp at any width, whole floor always visible.
	*/

	let sim_code = "{{ sim_code }}";
	let step = {{ step }};
	let max_step = 0;
	let sec_per_step = {{ sec_per_step }};
	let persona_init_pos = {{ persona_init_pos|safe }};
	let persona_snippets = {{ persona_snippets|safe }};
	let all_movement = {};
	let market_prices_by_step = {};
	let interactions_by_step = {};
	let is_running = {{ is_running|yesno:"true,false" }};
	let market_board_tile = {{ market_board_tile|safe }};
	let start_datetime = new Date(Date.parse("{{ start_datetime }}"));

	const POLL_INTERVAL_MS = 4000;
	const STEP_MS = 1600;

	// Map geometry -- office.json is 44x32 tiles at 16px.
	const TILE = 16;
	const MAP_W_TILES = 44, MAP_H_TILES = 32;
	const ZOOM = 2;

	const config = {
	  type: Phaser.AUTO,
	  width: MAP_W_TILES * TILE * ZOOM,
	  height: MAP_H_TILES * TILE * ZOOM,
	  parent: "game-container",
	  pixelArt: true,
	  backgroundColor: "#0b0e14",
	  physics: {default: "arcade", arcade: {gravity: {y: 0}}},
	  scene: {preload: preload, create: create, update: update}
	};
	const game = new Phaser.Game(config);

	let personas = {};
	let pronunciatios = {};
	let chat_bubbles = {};      // {bg, text} -- only shown during a real interaction
	let name_plates = {};
	let plate_offset = {};      // per-agent nameplate dy, staggered in create()
	let select_ring = null;
	let movement_target = {};   // per-agent goal tile [tx, ty]
	let movement_path = {};     // per-agent remaining waypoints, in tiles
	let current_tile = {};      // per-agent logical tile (authoritative for pathing)
	let last_facing = {};
	let walkable = null;        // [y][x] bool, built from the map's Collisions layer
	let map_w = 0, map_h = 0;
	const movement_speed = 2;   // px/frame, in map (unzoomed) pixels

	let selected_key = null;
	let log_filter = null;      // underscore key, or null for "all agents"

	function preload() {
	  this.load.crossOrigin = '';

	  // Office tileset pack (office-main). Keys here are bound to the tileset
	  // NAMES inside office.json via map.addTilesetImage(name, key) in create().
	  this.load.image("room_builder", "{% static 'assets/office/visuals/tilesets/Room_Builder_Office_16x16.png' %}");
	  this.load.image("modern_office", "{% static 'assets/office/visuals/tilesets/Modern_Office_16x16.png' %}");
	  this.load.image("blocks", "{% static 'assets/office/visuals/tilesets/blocks.png' %}");

	  this.load.tilemapTiledJSON("map", "{% static 'assets/office/visuals/office.json' %}");

	  {% for p in persona_names %}
		  {% with 'assets/characters/'|add:p.underscore|add:'.png' as image_static %}
			  this.load.atlas("{{p.underscore}}", "{% static image_static %}",
			  										  		     "{% static 'assets/characters/atlas.json' %}");
			{% endwith %}
	  {% endfor %}
	}

	function create() {
	  const map = this.make.tilemap({ key: "map" });

	  // Tileset names must match office.json's "tilesets"[].name exactly.
	  const room_builder = map.addTilesetImage("room_builder", "room_builder");
	  const modern_office = map.addTilesetImage("modern_office", "modern_office");
	  const blocks = map.addTilesetImage("blocks", "blocks");
	  const all_tilesets = [room_builder, modern_office, blocks];

	  map.createLayer("Floor", all_tilesets, 0, 0);
	  map.createLayer("Walls", all_tilesets, 0, 0);
	  map.createLayer("Furniture L1", all_tilesets, 0, 0);
	  map.createLayer("Furniture L2", all_tilesets, 0, 0);
	  const foregroundL1Layer = map.createLayer("Foreground L1", all_tilesets, 0, 0);
	  foregroundL1Layer.setDepth(4);
	  // The blocks layers (Collisions, Arena/Sector/World/Spawning) are
	  // authoring metadata painted with solid colour swatches, not scenery --
	  // never rendered. Collisions is read below purely as the walkability
	  // source for pathfinding.

	  map_w = map.width;
	  map_h = map.height;
	  const coll = map.getLayer("Collisions").data;
	  walkable = [];
	  for (let y = 0; y < map_h; y++) {
	    const row = [];
	    for (let x = 0; x < map_w; x++) {
	      const idx = coll[y][x].index;
	      row.push(idx === -1 || idx === 0);
	    }
	    walkable.push(row);
	  }

	  // Whole floor at 2x, no scrolling -- the point is watching all three at once.
	  const camera = this.cameras.main;
	  camera.setZoom(ZOOM);
	  camera.centerOn(map.widthInPixels / 2, map.heightInPixels / 2);

	  // Label the presentation-screen bank agents walk to on a real BUY/SELL
	  // (game object 32147 in the map's matrix; see sim_data.MARKET_BOARD_TILE).
	  const board_px = tile_to_px(market_board_tile[0], market_board_tile[1]);
	  this.add.text(board_px[0], board_px[1] - 30, "MARKET BOARD", {
	    fontFamily: "monospace", fontSize: "7px", color: "#0b0e14",
	    backgroundColor: "#4d9fff", padding: {x: 3, y: 2}
	  }).setOrigin(0.5, 0).setDepth(5).setResolution(3);

	  // Selection ring, parked off-screen until a card is clicked.
	  select_ring = this.add.circle(-100, -100, 10);
	  select_ring.setStrokeStyle(1.5, 0x4d9fff, 0.9);
	  select_ring.setDepth(1);

	  const anims = this.anims;
	  let agent_index = 0;
	  for (const key in persona_init_pos) {
	    // Nameplates are staggered vertically by agent so that two people
	    // standing on adjacent tiles (routine at the market board, where
	    // sim_data spreads simultaneous traders along one row) don't overprint
	    // each other into an unreadable "Marcus Sara Kim".
	    const plate_dy = 2 + (agent_index % 3) * 7;
	    plate_offset[key] = plate_dy;
	    agent_index += 1;
	    // Starting tile: wherever this agent's real record says they are at the
	    // initial step. Nothing has been polled yet, so this falls back to the
	    // desk position until the first poll lands -- not a fake walk-in.
	    const initial_rec = get_record(step, key);
	    const pos = initial_rec ? initial_rec.movement : persona_init_pos[key];
	    const start_px = tile_to_px(pos[0], pos[1]);
	    const start_x = start_px[0], start_y = start_px[1];

	    const sprite = this.add.sprite(start_x, start_y, key, "down");
	    sprite.displayWidth = 20;   // sized for this map's 16px tiles
	    sprite.scaleY = sprite.scaleX;
	    sprite.setDepth(2);
	    personas[key] = sprite;
	    current_tile[key] = [pos[0], pos[1]];
	    movement_target[key] = [pos[0], pos[1]];
	    movement_path[key] = [];
	    last_facing[key] = "down";

	    // Small nameplate so you can tell who's who at a glance without
	    // memorising three near-identical 16px sprites.
	    name_plates[key] = this.add.text(start_x, start_y + plate_dy, key.replace(/_/g, " "), {
	      fontFamily: "monospace", fontSize: "6px", color: "#d6dbe5",
	      backgroundColor: "#0b0e14cc", padding: {x: 2, y: 1}
	    }).setOrigin(0.5, 0).setDepth(3).setResolution(3);

	    // Action emoji above the head. 11px at 2x zoom reads clearly without
	    // swamping a 16px tile (the old 20px glyph covered most of a desk).
	    pronunciatios[key] = this.add.text(start_x, start_y - 22, "", {
	      fontFamily: "monospace", fontSize: "11px"
	    }).setOrigin(0.5, 0.5).setDepth(3);

	    // Real peer-conversation text (trading_interactions.py's LLM-generated
	    // summary). Created hidden and only shown on steps where this agent is
	    // genuinely in an interaction -- see render_step(). The old build left
	    // a 130x58px speech-bubble image permanently visible over every agent,
	    // which on a 704px-wide map covered a fifth of the office at all times.
	    const bubble_text = this.add.text(start_x, start_y - 32, "", {
	      fontFamily: "monospace", fontSize: "6px", color: "#d6dbe5",
	      backgroundColor: "#141922ee", padding: {x: 4, y: 3}, align: "center",
	      wordWrap: {width: 120, useAdvancedWrap: true}
	    }).setOrigin(0.5, 1).setDepth(6).setResolution(3);
	    bubble_text.visible = false;
	    chat_bubbles[key] = bubble_text;

	    // Walk-cycle anims, same atlas frame names the original engine uses
	    // (left-walk.000..003, etc, defined once for all personas in
	    // characters/atlas.json).
	    anims.create({key: key + "-left-walk", frames: anims.generateFrameNames(key, {prefix: "left-walk.", start: 0, end: 3, zeroPad: 3}), frameRate: 8, repeat: -1});
	    anims.create({key: key + "-right-walk", frames: anims.generateFrameNames(key, {prefix: "right-walk.", start: 0, end: 3, zeroPad: 3}), frameRate: 8, repeat: -1});
	    anims.create({key: key + "-down-walk", frames: anims.generateFrameNames(key, {prefix: "down-walk.", start: 0, end: 3, zeroPad: 3}), frameRate: 8, repeat: -1});
	    anims.create({key: key + "-up-walk", frames: anims.generateFrameNames(key, {prefix: "up-walk.", start: 0, end: 3, zeroPad: 3}), frameRate: 8, repeat: -1});
	  }

	  render_step(step);
	}

	// ###########################################################################
	// PATHFINDING -- the office has real furniture, so agents walk around it
	// rather than through it. Breadth-first search over the map's own Collisions
	// layer gives the shortest 4-directional route; update() then walks the
	// returned waypoints one tile at a time.
	// ###########################################################################

	function tile_to_px(tx, ty) {
	  // x centred in the tile, y at its bottom edge (the sprite's feet).
	  return [tx * TILE + TILE / 2, ty * TILE + TILE];
	}

	function is_walkable(x, y) {
	  return x >= 0 && y >= 0 && x < map_w && y < map_h && walkable && walkable[y][x];
	}

	function find_path(start, goal) {
	  if (start[0] === goal[0] && start[1] === goal[1]) return [];
	  if (!is_walkable(goal[0], goal[1])) return [];

	  const key_of = (x, y) => y * map_w + x;
	  const came_from = new Map();
	  const seen = new Set([key_of(start[0], start[1])]);
	  let frontier = [start];

	  while (frontier.length) {
	    const next_frontier = [];
	    for (const [cx, cy] of frontier) {
	      if (cx === goal[0] && cy === goal[1]) {
	        // Walk the parent chain back to the start.
	        const path = [];
	        let cur = key_of(cx, cy);
	        while (cur !== key_of(start[0], start[1])) {
	          path.push([cur % map_w, Math.floor(cur / map_w)]);
	          cur = came_from.get(cur);
	        }
	        return path.reverse();
	      }
	      const neighbours = [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]];
	      for (const [nx, ny] of neighbours) {
	        const nk = key_of(nx, ny);
	        if (seen.has(nk) || !is_walkable(nx, ny)) continue;
	        seen.add(nk);
	        came_from.set(nk, key_of(cx, cy));
	        next_frontier.push([nx, ny]);
	      }
	    }
	    frontier = next_frontier;
	  }
	  return [];   // unreachable -- agent simply stays put rather than teleporting
	}

	function set_target(key, tile) {
	  const cur_target = movement_target[key];
	  if (cur_target && cur_target[0] === tile[0] && cur_target[1] === tile[1]) return;
	  movement_target[key] = [tile[0], tile[1]];
	  movement_path[key] = find_path(current_tile[key], tile);
	}

	function update() {
	  for (const key in personas) {
	    const sprite = personas[key];
	    const path = movement_path[key];
	    let dir = null;

	    if (path && path.length) {
	      const [wx, wy] = path[0];
	      const [tx, ty] = tile_to_px(wx, wy);

	      if (sprite.x < tx) { sprite.x = Math.min(sprite.x + movement_speed, tx); dir = "right"; }
	      else if (sprite.x > tx) { sprite.x = Math.max(sprite.x - movement_speed, tx); dir = "left"; }
	      else if (sprite.y < ty) { sprite.y = Math.min(sprite.y + movement_speed, ty); dir = "down"; }
	      else if (sprite.y > ty) { sprite.y = Math.max(sprite.y - movement_speed, ty); dir = "up"; }

	      if (sprite.x === tx && sprite.y === ty) {
	        current_tile[key] = [wx, wy];
	        path.shift();
	      }
	    }

	    if (dir) {
	      sprite.anims.play(key + "-" + dir + "-walk", true);
	      last_facing[key] = dir;
	    } else if (sprite.anims.isPlaying) {
	      sprite.anims.stop();
	      sprite.setTexture(key, last_facing[key]);
	    }

	    pronunciatios[key].x = sprite.x;
	    pronunciatios[key].y = sprite.y - 22;
	    name_plates[key].x = sprite.x;
	    name_plates[key].y = sprite.y + plate_offset[key];
	    chat_bubbles[key].x = sprite.x;
	    chat_bubbles[key].y = sprite.y - 30;
	  }

	  if (select_ring && selected_key && personas[selected_key]) {
	    select_ring.x = personas[selected_key].x;
	    select_ring.y = personas[selected_key].y - 8;
	  }
	}

	// ###########################################################################
	// PAGE RENDERING
	// ###########################################################################

	function el(id) { return document.getElementById(id); }
	function esc(s) {
	  return String(s == null ? "" : s)
	    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
	}
	function money(v) {
	  return v == null ? "—" : "$" + Number(v).toLocaleString(undefined, {maximumFractionDigits: 0});
	}
	function positions_str(positions) {
	  const parts = [];
	  for (const sym in (positions || {})) parts.push(sym + "×" + positions[sym].qty);
	  return parts.length ? parts.join(" ") : "flat";
	}
	function action_kind(rec) {
	  const d = (rec && rec.description) || "";
	  if (d.startsWith("BUY")) return "buy";
	  if (d.startsWith("SELL")) return "sell";
	  return "hold";
	}
	function badge_html(rec) {
	  const status = (rec && rec.status) || "unknown";
	  let label = status;
	  if (rec && rec.error_reason) label += " · " + rec.error_reason;
	  if (rec && rec.hallucination) label += " · filtered";
	  return '<span class="badge ' + esc(status) + '">' + esc(label) + "</span>";
	}

	function get_record(target_step, underscore_key) {
	  const full_name = underscore_key.replace(/_/g, " ");
	  for (let s = target_step; s >= 0; s--) {
	    const bucket = all_movement[s];
	    if (bucket && full_name in bucket) return bucket[full_name];
	  }
	  return null;
	}

	function render_ticker() {
	  const prices = market_prices_by_step[step] || {};
	  const prev = market_prices_by_step[step - 1] || {};
	  const parts = ['<div class="label">Market</div>'];
	  for (const sym in prices) {
	    const px = Number(prices[sym]);
	    const was = prev[sym] != null ? Number(prev[sym]) : null;
	    let cls = "", delta = "";
	    if (was != null && was !== 0) {
	      const d = px - was;
	      cls = d > 0 ? " up" : (d < 0 ? " down" : "");
	      if (d !== 0) {
	        delta = '<span class="delta">' + (d > 0 ? "▲" : "▼") +
	                Math.abs(d / was * 100).toFixed(2) + "%</span>";
	      }
	    }
	    parts.push('<div class="tick' + cls + '"><span class="sym">' + esc(sym) +
	               '</span><span class="px">' + px.toFixed(2) + "</span>" + delta + "</div>");
	  }
	  if (Object.keys(prices).length === 0) {
	    parts.push('<div class="tick"><span class="sym">no market data for this step</span></div>');
	  }
	  el("market_ticker").innerHTML = parts.join("");
	}

	function render_interaction() {
	  const interaction = interactions_by_step[step];
	  const banner = el("interaction_banner");
	  if (!banner) return;
	  if (!interaction) { banner.style.display = "none"; return; }
	  banner.style.display = "block";
	  banner.innerHTML =
	    '<span class="who">💬 ' + esc((interaction.agents || []).join(" & ")) + "</span> — " +
	    '<span class="topic">' + esc(interaction.topic || "") + "</span><br>" +
	    esc(interaction.summary || "") +
	    (interaction.follow_up
	      ? '<span class="follow">Follow-up: ' + esc(interaction.follow_up) + "</span>"
	      : "");
	}

	function render_detail() {
	  const body = el("detail_body");
	  const title = el("detail_title");
	  const badge = el("detail_badge");
	  const link = el("detail_state_link");

	  if (!selected_key) {
	    title.textContent = "Agent Detail";
	    badge.innerHTML = "";
	    link.style.display = "none";
	    body.innerHTML = '<div class="detail-empty">Select an agent to see their action, ' +
	      "reasoning, and what <code>action_filtering.py</code> did with it.</div>";
	    return;
	  }

	  const name = selected_key.replace(/_/g, " ");
	  const rec = get_record(step, selected_key);
	  const snip = persona_snippets[selected_key] || {};

	  title.textContent = name;
	  link.style.display = "";
	  link.setAttribute("href", "/trading_persona_state/" + sim_code + "/" + step + "/" + selected_key + "/");

	  if (!rec) {
	    badge.innerHTML = "";
	    body.innerHTML = '<div class="detail-empty">No data yet for step ' + step + ".</div>";
	    return;
	  }

	  badge.innerHTML = badge_html(rec);

	  const bits = [];
	  bits.push('<div class="detail-row"><div class="detail-label">Current action</div>' +
	    '<div class="agent-action ' + action_kind(rec) + '" style="margin-top:0">' +
	    esc(rec.description) + (rec.outcome ? ' <span style="color:var(--text-faint); font-size:13px;">— ' +
	    esc(rec.outcome) + "</span>" : "") + "</div></div>");

	  bits.push('<div class="detail-row"><div class="detail-label">Reasoning (verbatim from the model)</div>' +
	    '<div class="detail-reasoning">' + (rec.reasoning ? esc(rec.reasoning) : "none given") + "</div></div>");

	  bits.push('<div class="detail-row"><div class="kv">' +
	    '<div><div class="k">Portfolio</div><div class="v">' + money(rec.portfolio_value) + "</div></div>" +
	    '<div><div class="k">Cash</div><div class="v">' + money(rec.cash) + "</div></div>" +
	    '<div><div class="k">Positions</div><div class="v">' + esc(positions_str(rec.positions)) + "</div></div>" +
	    (rec.stale_context != null
	      ? '<div><div class="k">Stale context</div><div class="v">' + esc(rec.stale_context) + "</div></div>" : "") +
	    (rec.persona_drift_score != null
	      ? '<div><div class="k">Persona drift</div><div class="v">' +
        Number(rec.persona_drift_score).toFixed(2) + "</div></div>" : "") +
	    "</div></div>");

	  if (snip.trading_strategy || snip.innate) {
	    bits.push('<div class="detail-row"><div class="detail-label">Persona</div>' +
	      '<div class="detail-reasoning">' +
	      esc([snip.trader_type, snip.risk_tolerance ? "risk: " + snip.risk_tolerance : ""]
	          .filter(Boolean).join(" · ")) +
	      (snip.trading_strategy ? "\n" + esc(snip.trading_strategy) : "") +
	      (snip.innate ? "\n" + esc(snip.innate) : "") + "</div></div>");
	  }

	  body.innerHTML = bits.join("");
	}

	function render_cards() {
	  for (const key in personas) {
	    const rec = get_record(step, key);
	    const emoji_el = el("quick_emoji-" + key);
	    if (emoji_el) emoji_el.textContent = rec ? rec.pronunciatio : "…";

	    const action_el = el("card_action-" + key);
	    const badge_el = el("card_badge-" + key);
	    const pv_el = el("card_pv-" + key);
	    const cash_el = el("card_cash-" + key);
	    const pos_el = el("card_pos-" + key);
	    if (!action_el) continue;

	    if (rec) {
	      action_el.textContent = rec.description;
	      action_el.className = "agent-action " + action_kind(rec);
	      badge_el.innerHTML = badge_html(rec);
	      pv_el.textContent = money(rec.portfolio_value);
	      cash_el.textContent = money(rec.cash);
	      pos_el.textContent = positions_str(rec.positions);
	    } else {
	      action_el.textContent = "—";
	      action_el.className = "agent-action hold";
	      badge_el.innerHTML = "";
	      pv_el.textContent = cash_el.textContent = pos_el.textContent = "—";
	    }
	  }
	}

	function render_log() {
	  const rows = [];
	  const steps = Object.keys(all_movement).map(Number).sort((a, b) => a - b);
	  for (const s of steps) {
	    const bucket = all_movement[s];
	    for (const name of Object.keys(bucket).sort()) {
	      const key = name.replace(/ /g, "_");
	      if (log_filter && key !== log_filter) continue;
	      const rec = bucket[name];
	      rows.push(
	        '<tr data-step="' + s + '"' + (s === step ? ' class="current"' : "") + ">" +
	        "<td>" + s + "</td>" +
	        "<td>" + esc(name) + "</td>" +
	        '<td class="act ' + action_kind(rec) + '">' + esc(rec.description) + "</td>" +
	        '<td class="num">' + money(rec.portfolio_value) + "</td>" +
	        "<td>" + badge_html(rec) + "</td>" +
	        '<td class="why" title="' + esc(rec.reasoning || "") + '">' +
	        esc(rec.reasoning || "—") + "</td></tr>");
	    }
	  }
	  const body = el("log_body");
	  body.innerHTML = rows.length
	    ? rows.join("")
	    : '<tr><td colspan="6" style="color:var(--text-faint); font-style:italic;">no decisions logged yet</td></tr>';

	  for (const tr of body.querySelectorAll("tr[data-step]")) {
	    tr.onclick = function () { pause_replay(); render_step(parseInt(this.dataset.step, 10)); };
	  }
	  // Keep the current step visible inside the log pane WITHOUT using
	  // scrollIntoView: that walks every scrollable ancestor including the
	  // document, so each playback tick yanked the whole page down past the
	  // ticker and clipped the first agent card under the sticky topbar.
	  // Scroll only the pane, and only when the row is actually out of view.
	  const cur = body.querySelector("tr.current");
	  const pane = body.closest(".log-scroll");
	  if (cur && pane) {
	    const top = cur.offsetTop, bottom = top + cur.offsetHeight;
	    if (top < pane.scrollTop) pane.scrollTop = top;
	    else if (bottom > pane.scrollTop + pane.clientHeight) {
	      pane.scrollTop = bottom - pane.clientHeight;
	    }
	  }
	}

	function render_step(s) {
	  step = Math.max(0, Math.min(max_step, s));
	  el("step-content").textContent = step;
	  el("step_slider").value = step;

	  const dt = new Date(start_datetime.getTime() + step * sec_per_step * 1000);
	  el("game-time-content").textContent = dt.toLocaleString(
	    "en-US", {weekday: "short", hour: "2-digit", minute: "2-digit"});

	  render_ticker();
	  render_interaction();

	  for (const key in personas) {
	    const rec = get_record(step, key);
	    if (rec && rec.movement) set_target(key, rec.movement);
	    if (pronunciatios[key]) pronunciatios[key].setText(rec ? rec.pronunciatio : "");

	    // Conversation text over the head only on steps the agent is really
	    // in an interaction.
	    const bubble = chat_bubbles[key];
	    if (bubble) {
	      if (rec && rec.chat) { bubble.setText(rec.chat); bubble.visible = true; }
	      else { bubble.visible = false; }
	    }
	  }

	  render_cards();
	  render_detail();
	  render_log();
	}

	function select_persona(key) {
	  selected_key = (selected_key === key) ? null : key;
	  for (const p_key in persona_init_pos) {
	    const card = el("card-" + p_key);
	    if (card) card.classList.toggle("selected", p_key === selected_key);
	  }
	  if (select_ring && !selected_key) { select_ring.x = -100; select_ring.y = -100; }
	  log_filter = selected_key;
	  el("log_filter_label").textContent = selected_key
	    ? selected_key.replace(/_/g, " ") : "all agents";
	  render_detail();
	  render_log();
	}

	// ###########################################################################
	// LIVE POLLING -- ask trading_poll() for whatever trading_reverie.py has
	// produced so far. As long as new steps keep arriving, play_replay()'s timer
	// keeps walking sprites into them; once a poll comes back with
	// sim_running=false, polling stops on its own.
	// ###########################################################################

	function update_live_badge() {
	  const e = el("live_badge");
	  if (!e) return;
	  if (is_running) {
	    e.className = "live";
	    e.innerHTML = '<span class="dot">●</span> LIVE';
	  } else {
	    e.className = "finished";
	    e.textContent = "FINISHED";
	  }
	}

	function poll_for_updates() {
	  fetch("/trading_poll/" + sim_code + "/")
	    .then(function (resp) { return resp.json(); })
	    .then(function (data) {
	      is_running = data.is_running;
	      market_prices_by_step = data.market_prices_by_step || {};
	      interactions_by_step = data.interactions_by_step || {};
	      for (const s in (data.movement || {})) {
	        all_movement[s] = data.movement[s];
	      }
	      const seen_steps = Object.keys(all_movement).map(Number);
	      max_step = seen_steps.length ? Math.max.apply(null, seen_steps) : 0;

	      el("step_slider").max = max_step;
	      el("max-step-content").textContent = max_step;
	      update_live_badge();

	      if (max_step > 0) play_replay();
	      else render_step(step);
	    })
	    .catch(function (err) { console.error("trading_poll failed:", err); })
	    .finally(function () {
	      if (is_running) setTimeout(poll_for_updates, POLL_INTERVAL_MS);
	    });
	}

	let play_interval = null;
	function play_replay() {
	  if (play_interval) return;
	  el("play_button").textContent = "▶ Playing";
	  play_interval = setInterval(function () {
	    if (step >= max_step) {
	      // Caught up to everything downloaded so far. If the backend is done
	      // producing steps, stop; otherwise wait -- the next poll raises
	      // max_step and this same interval picks the walk back up.
	      if (!is_running) pause_replay();
	      return;
	    }
	    render_step(step + 1);
	  }, STEP_MS);
	}
	function pause_replay() {
	  if (play_interval) { clearInterval(play_interval); play_interval = null; }
	  el("play_button").textContent = "▶ Play";
	}

	document.addEventListener("DOMContentLoaded", function () {
	  el("play_button").onclick = play_replay;
	  el("pause_button").onclick = pause_replay;
	  el("prev_button").onclick = function () { pause_replay(); render_step(step - 1); };
	  el("next_button").onclick = function () { pause_replay(); render_step(step + 1); };
	  el("step_slider").oninput = function (e) {
	    pause_replay();
	    render_step(parseInt(e.target.value, 10));
	  };
	  el("log_clear_filter").onclick = function () {
	    if (selected_key) select_persona(selected_key);   // toggles off
	  };

	  for (const card of document.querySelectorAll(".agent-card")) {
	    card.onclick = function () { select_persona(this.dataset.key); };
	  }

	  // Static persona role line on each card -- straight from scratch.json.
	  for (const key in persona_snippets) {
	    const role_el = el("role-" + key);
	    const snip = persona_snippets[key];
	    if (role_el && snip) {
	      role_el.textContent = [snip.trader_type, snip.risk_tolerance ? snip.risk_tolerance + " risk" : ""]
	        .filter(Boolean).join(" · ");
	    }
	  }

	  // Keyboard scrubbing.
	  document.addEventListener("keydown", function (e) {
	    if (e.key === "ArrowLeft")  { pause_replay(); render_step(step - 1); }
	    if (e.key === "ArrowRight") { pause_replay(); render_step(step + 1); }
	    if (e.key === " ") { e.preventDefault(); play_interval ? pause_replay() : play_replay(); }
	  });

	  update_live_badge();
	  poll_for_updates();
	});
</script>
